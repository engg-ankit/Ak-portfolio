<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ankit Kumar - Portfolio Thumbnail</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
        }
        
        .thumbnail {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            border-radius: 20px;
            padding: 60px;
            display: flex;
            align-items: center;
            gap: 50px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .thumbnail::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: shimmer 3s infinite;
        }
        
        @keyframes shimmer {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(25%, 25%); }
        }
        
        .profile-section {
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }
        
        .profile-image {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 6px solid rgba(255, 255, 255, 0.3);
            background: #fff;
            object-fit: cover;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }
        
        .content-section {
            flex: 1;
            color: white;
            position: relative;
            z-index: 1;
        }
        
        .name {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            letter-spacing: -1px;
        }
        
        .title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 20px;
            opacity: 0.95;
            line-height: 1.3;
        }
        
        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 25px;
        }
        
        .skill-tag {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }
        
        .skill-tag:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .url {
            margin-top: 30px;
            font-size: 18px;
            font-weight: 500;
            opacity: 0.9;
            background: rgba(255, 255, 255, 0.15);
            padding: 12px 25px;
            border-radius: 10px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .decorative-dots {
            position: absolute;
            top: 30px;
            right: 30px;
            display: flex;
            gap: 8px;
        }
        
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
        }
        
        .bottom-accent {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
            border-radius: 0 0 20px 20px;
        }
    </style>
</head>
<body>
    <div class="thumbnail">
        <div class="decorative-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        
        <div class="profile-section">
            <img src="./assets/images/ankitimg.png" alt="Ankit Kumar" class="profile-image">
        </div>
        
        <div class="content-section">
            <h1 class="name">Ankit Kumar</h1>
            <p class="title">MERN Stack Developer | MongoDB Expert</p>
            
            <div class="skills">
                <span class="skill-tag">MongoDB</span>
                <span class="skill-tag">Express.js</span>
                <span class="skill-tag">React.js</span>
                <span class="skill-tag">Node.js</span>
                <span class="skill-tag">Python</span>
                <span class="skill-tag">AI & ML</span>
            </div>
            
            <div class="url">ankitkumar-aiml.netlify.app</div>
        </div>
        
        <div class="bottom-accent"></div>
    </div>
</body>
</html>
